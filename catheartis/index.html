<!DOCTYPE html>
<html lang="en">
<head>
<base href="/catheartis/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tales of Catheartis</title>
<meta name="description" content="Tales of Catheartis, a scrolling dark-fantasy comic.">
<meta name="theme-color" content="#000000">
<script>/* keep relative asset paths working when the folder is opened without a trailing slash */if(!/\/$|\.html?$/.test(location.pathname))location.replace(location.pathname+'/'+location.search+location.hash);</script>
<link rel="preload" href="assets/hero.jpg" as="image">
<link rel="preload" href="assets/logo-glow.png" as="image">
<style>
@font-face{font-family:"Grenze Gotisch";src:url("fonts/grenze-gotisch.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Grenze";src:url("fonts/grenze.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Comic Neue";src:url("fonts/comic-bi.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
:root{
  /* layout: one 620px webtoon column; 9:16 panels joined by soft bleeds or slanted comic cuts, with sticky close-up stages */
  --void:#050507;
  --storm:#090e15;
  --bone:#efe6d2;
  --gilt:#c9a46a;
  --ink:#12161f;
  --caption:#fff03c;
  --font-gothic:"Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --font-title:"Grenze", Georgia, serif;
  --font-letter:"Comic Neue", "Comic Sans MS", cursive;
  --col:min(100vw, max(620px, 70vh));
  color-scheme:dark;
}
@media (orientation: portrait){:root{--col:100vw}}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--bone)}
body{font-family:var(--font-title);-webkit-font-smoothing:antialiased;overflow-x:clip;position:relative;z-index:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:4;mix-blend-mode:screen}
.strip{position:relative;width:var(--col);max-width:100vw;margin:0 auto;background:var(--void)}

/* ---------- title (column width) ---------- */
#title{position:relative;height:250vh}
.t-stage{position:sticky;top:0;height:100vh;overflow:hidden;background:#1a0505;container-type:inline-size}
.t-stage .fallback,.t-stage .gl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 45%}
.gl{opacity:0;transition:opacity .6s ease}
.gl.on{opacity:1}
.haze{position:absolute;inset:-10% -10% 0;background:url("assets/fog.jpg") repeat;background-size:900px 450px;mix-blend-mode:screen;opacity:.32;filter:sepia(1) saturate(6) hue-rotate(-28deg) brightness(.9);pointer-events:none}
.t-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.t-shade{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 40%,transparent 40%,rgba(5,5,7,.55) 100%),linear-gradient(180deg,rgba(5,5,7,0) 45%,rgba(5,5,7,.78) 88%);pointer-events:none}
.lockup{position:absolute;left:0;right:0;bottom:15vh;display:grid;justify-items:center;padding:0 16px;will-change:transform,opacity}
.logo{display:block;width:min(103cqw,672px);max-width:none;height:auto;opacity:0;transform:scale(1.35)}
.go .logo{animation:stampLogo .75s .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampLogo{to{opacity:1;transform:none}}
.slash{position:absolute;left:-20%;right:-20%;top:50%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,240,220,0) 20%,#fff 50%,rgba(255,200,150,0) 80%,transparent);transform:rotate(-14deg) scaleX(0);transform-origin:0 50%;opacity:0;box-shadow:0 0 18px 4px rgba(255,140,80,.6)}
.go .slash{animation:slash .55s .4s cubic-bezier(.7,0,.2,1) forwards}
@keyframes slash{0%{opacity:1;transform:rotate(-14deg) scaleX(0)}55%{opacity:1;transform:rotate(-14deg) scaleX(1)}100%{opacity:0;transform:rotate(-14deg) scaleX(1) translateY(-4px)}}
.cue{position:absolute;left:0;right:0;bottom:5vh;margin:0;text-align:center;font-size:13px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;color:#c9a98a;opacity:0}
.cue.go{animation:rise 1s 1.8s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.cue span{display:inline-block;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.t-fade{position:absolute;inset:0;background:var(--void);opacity:0;pointer-events:none}

/* ---------- storm ---------- */
#storm{position:relative;height:110vh;background:linear-gradient(180deg,var(--void) 0%,#06080c 40%,var(--storm) 100%)}
.storm-flash{position:absolute;inset:0;background:radial-gradient(90% 60% at 60% 70%,rgba(190,215,255,.9),rgba(120,150,220,.25) 50%,transparent 80%);mix-blend-mode:screen;opacity:0;pointer-events:none}
#sfx{position:absolute;left:0;top:0;width:100%;overflow:visible;z-index:5;pointer-events:none}
#sfx text{font-family:var(--font-gothic);font-weight:900}
.s-glow{fill:#8fc0ff;stroke:#8fc0ff;stroke-linejoin:round;filter:url(#blur6);opacity:.7}
.s-ink{fill:#0b1222;stroke:#0b1222;stroke-linejoin:round}
.s-fill{fill:url(#iceGrad)}
.b-glow{fill:none;stroke:#9cc4ff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;filter:url(#blur6);opacity:.8}
.b-mid{fill:none;stroke:#dfeaff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.b-core{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- panels ---------- */
.pn{position:relative;width:100%;aspect-ratio:9/16;container-type:inline-size;overflow:clip;will-change:transform}
.pn .fallback,.pn .gl,.st .fallback,.st .gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{object-fit:cover}
.gl-on .fallback{opacity:0;transition:opacity 0s .6s}
.ov{margin-top:-17.8%}
#castle{background:linear-gradient(180deg,var(--storm) 0,var(--storm) 60%,var(--void) 100%)}
#castle .gl,#castle .fallback{-webkit-mask-image:linear-gradient(180deg,transparent 0,rgba(0,0,0,.35) 4%,#000 11%,#000 91%,rgba(0,0,0,.25) 100%);mask-image:linear-gradient(180deg,transparent 0,rgba(0,0,0,.35) 4%,#000 11%,#000 91%,rgba(0,0,0,.25) 100%)}
.st{position:relative;width:100%}
.st .inner{position:sticky;top:0;height:100vh;overflow:clip;container-type:inline-size}
.st .gl,.st .fallback{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 var(--ft,0%));mask-image:linear-gradient(180deg,transparent 0,#000 var(--ft,0%))}
.att{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;pointer-events:none;will-change:transform}
.glows{mix-blend-mode:screen}
.ui{z-index:6}
.fog{position:absolute;left:0;right:0;background:url("assets/fog.jpg") repeat-x;background-size:220% 100%;mix-blend-mode:screen;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 35%,#000 70%,transparent)}
.fog.f1{top:60%;height:22%;opacity:.42}
.fog.f2{top:68%;height:26%;opacity:.3;background-size:160% 100%;filter:hue-rotate(10deg) sepia(.4)}
.fog.low{top:62%;height:38%;opacity:.38;filter:hue-rotate(110deg) saturate(.6)}
.fog.smoke{top:0;height:60%;opacity:.34;background-size:180% 70%;background-repeat:repeat;filter:sepia(1) saturate(2.4) hue-rotate(-12deg) brightness(.85)}
.torch{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,214,140,.75) 0%,rgba(255,140,50,.32) 30%,rgba(255,90,20,.08) 55%,transparent 70%);will-change:opacity,transform}
.torch.floor{aspect-ratio:2.6;background:radial-gradient(closest-side,rgba(255,150,60,.35),rgba(255,100,30,.1) 60%,transparent)}
.torch.soft{background:radial-gradient(circle,rgba(255,170,80,.4),rgba(255,110,40,.1) 45%,transparent 70%)}
.torch.moon{background:radial-gradient(circle,rgba(220,240,255,.55),rgba(160,200,255,.18) 40%,transparent 70%)}
.torch.blood{background:radial-gradient(closest-side,rgba(255,30,30,.42),rgba(180,0,0,.14) 55%,transparent)}
.pulse{position:absolute;transform:translate(-50%,-50%);border-radius:50%;will-change:opacity,transform;opacity:0}
.pulse.eye{aspect-ratio:1;background:radial-gradient(circle,rgba(255,240,230,.8) 0 5%,rgba(255,40,30,.6) 14%,rgba(220,0,0,.2) 34%,transparent 62%)}
.ray{position:absolute;inset:0;filter:blur(10px);opacity:.3;will-change:opacity}
.ray i{position:absolute;inset:0;background:linear-gradient(160deg,rgba(220,235,255,.9),rgba(160,200,255,.25) 60%,transparent)}
.glint{position:absolute;width:9cqw;aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);opacity:0;background:radial-gradient(circle,#fff 0 5%,rgba(255,240,210,.7) 10%,transparent 34%),linear-gradient(90deg,transparent 0 47%,rgba(255,250,235,.95) 50%,transparent 53%) center/100% 7% no-repeat,linear-gradient(0deg,transparent 0 47%,rgba(255,250,235,.95) 50%,transparent 53%) center/7% 100% no-repeat}
.glint.live{animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,62%,100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}74%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(30deg)}86%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(55deg)}}

.bubble{position:absolute;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #182132;color:var(--ink);opacity:0;will-change:transform,opacity}
.bubble .type,.caption .type{position:relative;margin:0;font-family:var(--font-letter);font-weight:700;font-style:italic;font-size:var(--fs,2.6cqw);line-height:1.2;text-align:center;text-wrap:balance}
.bubble .type{padding:0 1.6cqw}
.tail{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tail path{fill:#fff;stroke:#182132;stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.caption{position:absolute;margin:0;display:flex;align-items:center;justify-content:center;background:var(--caption);border:2px solid #111;box-shadow:.5cqw .5cqw 0 rgba(0,0,0,.55);opacity:0;will-change:transform,opacity}
.caption .type{color:#111;font-size:var(--fs,2.55cqw);line-height:1.2;padding:0 1.2cqw}
.ghost{position:absolute;inset:0;border:2px solid rgba(190,215,255,.7);border-radius:inherit;display:flex;align-items:center;justify-content:center;font-family:var(--font-letter);font-weight:700;font-style:italic;color:rgba(200,225,255,.85);opacity:0;pointer-events:none}
.echoing .ghost{animation:ghost 2.6s ease-out infinite}
.echoing .ghost:nth-of-type(2){animation-delay:.85s}
.echoing .ghost:nth-of-type(3){animation-delay:1.7s}
@keyframes ghost{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9) translate(-6%,-14%)}}
.w{white-space:nowrap}
.ch{opacity:0}
.ch.on{opacity:1}
.ch.hot{color:#e2561b;text-shadow:0 0 6px rgba(255,140,40,.9)}
.spark{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 1px;border-radius:50%;background:#ffd28a;box-shadow:0 0 6px 2px rgba(255,150,50,.95),0 0 14px 5px rgba(255,110,30,.4);opacity:0;pointer-events:none}

/* sound lettering */
.sx{position:absolute;margin:0;font-family:var(--font-gothic);font-weight:900;line-height:1;white-space:nowrap;opacity:0;-webkit-text-stroke:.09em #0b1222;paint-order:stroke fill;will-change:transform,opacity}
.sx.ice{color:#e9f1ff;text-shadow:0 0 .25em rgba(140,185,255,.85),0 .06em 0 #0b1222}
.sx.iron{color:#efe0c2;-webkit-text-stroke-color:#1b0f08;text-shadow:0 0 .3em rgba(255,120,40,.55),0 .06em 0 #1b0f08}

/* name card */
.namecard{position:absolute;left:7%;bottom:10%;z-index:7;display:grid;gap:.4em;pointer-events:none}
.namecard .nm{margin:0;font-family:var(--font-gothic);font-weight:700;font-size:clamp(34px,11cqw,70px);line-height:.95;letter-spacing:.01em;color:#f3ead7;white-space:nowrap;filter:drop-shadow(0 0 16px rgba(120,140,255,.35)) drop-shadow(0 4px 0 rgba(0,0,0,.8))}
.namecard .nm span{display:inline-block;opacity:0;transform:translateX(-30px) skewX(-12deg);filter:blur(6px)}
.namecard .rule{height:2px;width:0;background:linear-gradient(90deg,var(--gilt),rgba(201,164,106,0));box-shadow:0 0 10px rgba(201,164,106,.6)}
.namecard .sub{margin:0;font-family:var(--font-title);font-weight:600;font-size:clamp(12px,3cqw,17px);letter-spacing:.3em;text-transform:uppercase;color:var(--gilt);opacity:0;text-shadow:0 2px 0 rgba(0,0,0,.8)}

/* echo gutter */
#echo{position:relative;height:85vh;container-type:inline-size;background:var(--void);overflow:clip}
#echo .e{position:absolute;margin:0;font-family:var(--font-gothic);font-weight:700;color:#f1e7d3;white-space:nowrap;transform:translate(-50%,-50%);opacity:0;will-change:transform,opacity,filter;text-shadow:0 0 18px rgba(255,90,50,.4)}

/* ---------- end ---------- */
#end{position:relative;height:95vh;display:grid;place-items:center;background:var(--void)}
.end-lockup{display:grid;justify-items:center;gap:1.4em;text-align:center;container-type:inline-size;width:100%}
.end-lockup .logo{width:min(84cqw,504px);opacity:1;transform:none}
.tbc{margin:0;font-size:14px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:#a99883}

/* sound toggle */
#snd{position:fixed;z-index:30;top:14px;right:calc(max(0px,(100vw - var(--col)) / 2) + 14px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;background:rgba(8,8,12,.55);border:1px solid rgba(239,230,210,.35);color:var(--bone);cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s,border-color .2s,color .2s}
#snd svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#snd .spk{fill:currentColor;stroke:none}
#snd .w1,#snd .w2{display:none}
#snd[aria-pressed="true"] .w1,#snd[aria-pressed="true"] .w2{display:inline}
#snd[aria-pressed="true"] .x{display:none}
#snd[aria-pressed="true"]{border-color:rgba(255,170,90,.75);color:#ffd9a8}
#snd:hover{background:rgba(24,18,14,.78)}
#snd:focus-visible{outline:2px solid #ffd28a;outline-offset:3px}
#snd.nudge{animation:sndnudge 2.4s 1.8s ease-in-out 3}
@keyframes sndnudge{0%,100%{box-shadow:0 0 0 0 rgba(255,170,90,0)}40%{box-shadow:0 0 0 7px rgba(255,170,90,.28)}}
.snd-hint{position:fixed;z-index:30;top:29px;right:calc(max(0px,(100vw - var(--col)) / 2) + 68px);margin:0;font-family:var(--font-title);font-weight:600;font-size:12px;line-height:1;letter-spacing:.22em;text-transform:uppercase;color:#e9c9a6;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .6s;pointer-events:none}
.snd-hint.show{opacity:1}

@media (prefers-reduced-motion: reduce){
  #snd.nudge{animation:none}
  .logo,.cue{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}
  .slash,.glint,.ghost{display:none}
  .cue span{animation:none}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="snd" class="nudge" type="button" aria-pressed="false" aria-label="Turn sound on">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3.5 9.2h3.8L12.5 5v14l-5.2-4.2H3.5z"/><path class="w1" d="M15.6 9.4a3.8 3.8 0 0 1 0 5.2"/><path class="w2" d="M18.2 6.8a7.6 7.6 0 0 1 0 10.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>
<p class="snd-hint" aria-hidden="true">Tap for sound</p>

<main class="strip">
  <section id="title">
    <div class="t-stage">
      <img class="fallback" src="assets/hero.jpg" alt="Three armored knights in black hooded cloaks charge through burning ruins, swords drawn, debris flying.">
      <canvas class="gl" aria-hidden="true"></canvas>
      <div class="haze" aria-hidden="true"></div>
      <canvas class="t-fx" aria-hidden="true"></canvas>
      <div class="t-shade" aria-hidden="true"></div>
      <div class="lockup">
        <div class="slash" aria-hidden="true"></div>
        <h1 style="margin:0"><img class="logo" src="assets/logo-glow.png" alt="Tales of Catheartis"></h1>
      </div>
      <p class="cue">Scroll <span aria-hidden="true">↓</span></p>
      <div class="t-fade" aria-hidden="true"></div>
    </div>
  </section>

  <section id="storm" aria-label="Thunder over the castle">
    <div class="storm-flash" aria-hidden="true"></div>
    <svg id="sfx" role="img" aria-label="Kra-Koom!"></svg>
  </section>

  <section class="pn pnl" id="castle" data-top="storm" data-img="assets/castle.jpg" data-depth="assets/castle-depth.png" data-glow="assets/castle-bolt.jpg">
    <img class="fallback" loading="lazy" src="assets/castle-full.jpg" alt="Castle Catheartis, a vast gothic fortress of black spires, under a storm of rain and lightning.">
    <canvas class="gl" aria-hidden="true"></canvas>
    <div class="fog f1" aria-hidden="true"></div>
    <div class="fog f2" aria-hidden="true"></div>
    <div class="att ui">
      <figure class="caption" data-box="74,150,458,287"><p class="type" data-text="Castle Catheartis. The Third Age."></p></figure>
    </div>
  </section>

  <section class="pn pnl" id="p2" data-top="fade" data-img="assets/p2.jpg" data-depth="assets/p2-depth.png">
    <img class="fallback" loading="lazy" src="assets/p2.jpg" alt="A rain-soaked messenger holding a black box faces the bearded king on his throne, flanked by rows of armored knights and torches.">
    <canvas class="gl" aria-hidden="true"></canvas>
    <div class="att glows" aria-hidden="true">
      <i class="torch" style="left:3%;top:29%;width:20%"></i><i class="torch" style="left:97%;top:29%;width:18%"></i>
      <i class="torch" style="left:81%;top:39.5%;width:14%"></i><i class="torch" style="left:74.5%;top:42.5%;width:12%"></i>
      <i class="torch" style="left:29%;top:45.5%;width:13%"></i><i class="torch soft" style="left:9%;top:40%;width:14%"></i>
      <i class="torch floor" style="left:80%;top:71%;width:40%"></i>
    </div>
    <div class="att ui">
      <div class="bubble" data-body="623,721,979,987" data-tip="696,1009"><p class="type" data-text="What tidings does the Regent of Khal Veyron bring this dismal evening?"></p></div>
      <div class="bubble" data-body="622,1491,999,1757" data-tip="599,1624"><p class="type" data-text="I know not what is in the package, my liege. Only that it is of the utmost urgency."></p></div>
    </div>
  </section>

  <section class="pn pnl" id="p3" data-top="fade" data-img="assets/p3.jpg" data-depth="assets/p3-depth.png">
    <img class="fallback" loading="lazy" src="assets/p3.jpg" alt="Close on the king: a scowling, grey-bearded old man in a jagged crown and red brocade robes, a knight in plate armor standing guard behind him before burning braziers.">
    <canvas class="gl" aria-hidden="true"></canvas>
    <div class="att glows" aria-hidden="true">
      <i class="torch" style="left:97.5%;top:42.5%;width:24%"></i><i class="torch" style="left:92.5%;top:45.5%;width:16%"></i>
      <i class="glint" style="left:76.2%;top:43.2%"></i><i class="glint" style="left:74.8%;top:48.6%;animation-delay:1.3s"></i>
    </div>
    <div class="att ui">
      <div class="bubble" data-body="581,187,915,453" data-tip="654,475"><p class="type" data-text="Then approach with haste. The Regent is not one to mince words."></p></div>
    </div>
  </section>

  <section class="pn pnl" id="p4" data-top="fade" data-img="assets/p4-base.jpg" data-depth="assets/p4-depth.png" data-aux="assets/p4-box.png">
    <img class="fallback" loading="lazy" src="assets/p4.jpg" alt="From behind the throne: the king's jagged crown in the foreground, the young messenger approaching down the aisle between hooded knights, raising the black box.">
    <canvas class="gl" aria-hidden="true"></canvas>
    <div class="att glows" aria-hidden="true">
      <i class="torch" style="left:6.8%;top:24.5%;width:13%"></i><i class="torch" style="left:14%;top:26%;width:9%"></i>
      <i class="torch" style="left:92.5%;top:24.5%;width:13%"></i><i class="torch" style="left:85%;top:25.5%;width:9%"></i>
      <i class="torch soft" style="left:19%;top:28%;width:6%"></i><i class="torch soft" style="left:23%;top:28%;width:5%"></i>
      <i class="torch soft" style="left:78%;top:28%;width:6%"></i><i class="torch soft" style="left:74%;top:28.5%;width:5%"></i>
    </div>
    <div class="att ui">
      <div class="bubble" data-body="616,339,993,694" data-tip="689,716"><p class="type" data-text="The Regent also told me to relay that this item was found less than a day ago within the nobles' estates."></p></div>
    </div>
  </section>

  <section class="pn pnl" id="p5" data-top="fade" data-img="assets/p5.jpg" data-depth="assets/p5-depth.png">
    <img class="fallback" loading="lazy" src="assets/p5.jpg" alt="Over the messenger's shoulder, his hands hold out the black box to the one-eyed king on his throne.">
    <canvas class="gl" aria-hidden="true"></canvas>

  function drawTitleFX(dt, t, P) {

  /* ---------- storm: "Kra-Koom!" carved in blackletter, and the bolt that strikes the castle ---------- */
  const storm = $('#storm'), sfx = $('#sfx'), stormFlash = $('.storm-flash');
  const mctx = document.createElement('canvas').getContext('2d');
  let SF = null;
  function buildStorm() {
    sfx.innerHTML = '';
    const W = storm.clientWidth, H = storm.clientHeight, CH = $('#castle').clientHeight;
    const map = (px, py) => [W * ((px / IW - 0.5) * 1.05 + 0.5), H + CH * ((py / IH - 0.5) * 1.05 + 0.5)];
    const [endX, endY] = map(963, 143);
    const tailPts = [[963, 180], [922, 220], [904, 260], [903, 300]].map(q => map(q[0], q[1]));
    const SH = H + CH * 0.14;
    sfx.setAttribute('viewBox', '0 0 ' + W + ' ' + SH); sfx.style.height = SH + 'px';
    const defs = svg('defs', null, sfx);
    const fl = svg('filter', { id: 'blur6', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
    svg('feGaussianBlur', { stdDeviation: '6' }, fl);
    const g = svg('linearGradient', { id: 'iceGrad', x1: '0', y1: '0', x2: '0', y2: '1' }, defs);
    [['0', '#ffffff'], ['0.45', '#e3ecff'], ['0.55', '#b9cdf0'], ['1', '#e9f0ff']].forEach(([o, c]) => svg('stop', { offset: o, 'stop-color': c }, g));
    // two carved lines, laid out from real glyph widths
    const lines = [{ txt: 'Kra-', size: Math.min(W * 0.27, 170), cx: 0.44, y: 0.2 }, { txt: 'Koom!', size: Math.min(W * 0.34, 215), cx: 0.53, y: 0.45 }];
    const letters = [];
    rnd = 5;
    for (const L of lines) {
      mctx.font = '900 ' + L.size + 'px "Grenze Gotisch", Georgia, serif';
      let ws = L.txt.split('').map(ch => mctx.measureText(ch).width);
      let total = ws.reduce((a, b) => a + b, 0) * 0.98;
      if (total > W * 0.84) { const f = W * 0.84 / total; L.size *= f; ws = ws.map(x => x * f); total *= f; }
      let x = W * L.cx - total / 2;
      L.txt.split('').forEach((ch, i) => {
        const cxp = x + ws[i] * 0.49;
        letters.push({ ch, size: L.size, x: cxp, y: H * L.y - (cxp - W / 2) * 0.1, rot: (rand() - 0.5) * 5 - 4, ph: rand() * 6, w: ws[i] });
        x += ws[i] * 0.98;
      });
    }
    // the bolt leaves the foot of the final "m"
    const mL = letters[letters.length - 2], startX = mL.x - mL.w * 0.18, startY = mL.y + mL.size * 0.3;
    rnd = 11;
    let pts = [[startX, startY], [endX, endY]], disp = W * 0.22;
    for (let k = 0; k < 7; k++) {
      const np = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
        const o = (rand() - 0.5) * disp;
        np.push([(a[0] + b[0]) / 2 - (b[1] - a[1]) / len * o, (a[1] + b[1]) / 2 + (b[0] - a[0]) / len * o], b);
      }
      pts = np; disp *= 0.55;
    }
    pts = pts.concat(tailPts);
    const bolts = [];
    const boltG = svg('g', { class: 'bolt' }, sfx);
    const mkLine = (pp, w) => {
      const d = 'M' + pp.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L');
      const cum = [0]; for (let i = 1; i < pp.length; i++) cum.push(cum[i - 1] + Math.hypot(pp[i][0] - pp[i - 1][0], pp[i][1] - pp[i - 1][1]));
      const total = cum[cum.length - 1];
      const paths = ['b-glow', 'b-mid', 'b-core'].map(c => { const p = svg('path', { d, class: c }, boltG); p.style.strokeDasharray = total + ' ' + (total + 50); p.style.strokeDashoffset = total; if (w) p.style.strokeWidth = (c === 'b-glow' ? 8 : c === 'b-mid' ? 2.4 : 1) * w; return p; });
      return { pp, cum, total, paths, y0: pp[0][1] };
    };
    const main = mkLine(pts);
    bolts.push(main);
    [0.28, 0.5, 0.72].forEach((f, n) => {
      const i0 = Math.floor(pts.length * f), p0 = pts[i0];
      const dir = n % 2 ? 1 : -1, len = W * (0.12 + rand() * 0.1);
      let fp = [p0, [p0[0] + dir * len * 0.8, p0[1] + len * 0.7]], dd = len * 0.35;
      for (let k = 0; k < 4; k++) { const np = [fp[0]]; for (let i = 1; i < fp.length; i++) { const a = fp[i - 1], b = fp[i]; const o = (rand() - 0.5) * dd; np.push([(a[0] + b[0]) / 2 + o * 0.6, (a[1] + b[1]) / 2 + o * 0.4], b); } fp = np; dd *= 0.55; }
      const L = mkLine(fp, 0.6); L.at = main.cum[i0]; bolts.push(L);
    });
    for (const L of letters) {
      L.g = svg('g', null, sfx);
      const base = { x: '0', y: '0', dy: '0.32em', 'text-anchor': 'middle', 'font-size': f1(L.size) };
      [['s-glow', L.size * 0.16], ['s-ink', L.size * 0.085], ['s-fill']].forEach(([c, sw]) => {
        const a = Object.assign({ class: c }, base); if (sw) a['stroke-width'] = f1(sw);

  }

        popK = Math.min(popK, range(settle, 0.85, 1));
        let sc = lerp(0.35, 1, easeBack(popK));
        if (it.shout && popK > 0 && popK < 1 && !RM) sc *= 1 + (Math.random() - 0.5) * 0.06;
        const sl = Lx + it.ox * zz, sr = sl + it.ow * zz;
        let dx = 0;
        if (sl < 6) dx = (6 - sl) / zz; else if (sr > P.W - 6) dx = (P.W - 6 - sr) / zz;
        // keep lettering inside its frame vertically too (the camera crops the art on wider screens)
        const mg = Math.max(10, hV * 0.015), st0 = Ly + it.oy * zz, sb0 = st0 + it.oh * zz, botLim = hV * (P.isStage ? 1 : 0.9) - mg;
        let dy = 0;
        if (st0 < mg) dy = (mg - st0) / zz; else if (sb0 > botLim) dy = (botLim - sb0) / zz;
        it.el.style.opacity = (clamp(popK * 3) * (1 - outK)).toFixed(3);
        it.el.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')' + (it.isCap ? ' rotate(' + ((1 - popK) * -4).toFixed(2) + 'deg)' : '');
        it.typer.set(popK > 0 ? typeK : 0);
        if (it.el.classList.contains('echo')) it.el.classList.toggle('echoing', it.typer.done && outK < 0.5 && !RM);
      }
    }
    return amb;
  }

  /* ---------- echo gutter ---------- */
  const echo = $('#echo'), echoes = $$('.e', echo).map((el, i) => ({ el, i, x: +el.dataset.x, y: +el.dataset.y, s: +el.dataset.s, o: +el.dataset.o, b: +el.dataset.b }));
  echoes.forEach(E => { E.el.style.left = E.x + '%'; E.el.style.top = E.y + '%'; E.el.style.fontSize = E.s + 'cqw'; });
  function updateEcho(y, vh, t) {
    const top = OFF.echo, h = OFF.echoH;
    if (y + vh < top - 40 || y > top + h + 40) return;
    for (const E of echoes) {
      const ey = top + h * E.y / 100;
      const k = RM ? 1 : range(y + vh * 0.85 - ey, 0, vh * 0.18);
      if (k > 0.04 && !E.fired) { E.fired = true; SND.echo(E.i); } if (k <= 0) E.fired = false;
      const drift = RM ? 0 : Math.sin(t * 0.002 + E.i) * (1.5 + E.i * 1.5);
      E.el.style.opacity = (k * E.o).toFixed(3);
      E.el.style.transform = 'translate(calc(-50% + ' + drift.toFixed(1) + 'px),-50%) scale(' + lerp(1.4, 1, easeOut(k)).toFixed(3) + ')';
      E.el.style.filter = 'blur(' + (E.b + (1 - k) * 4).toFixed(2) + 'px)';
      E.el.style.letterSpacing = (0.01 + E.i * 0.05 + (1 - k) * 0.2).toFixed(3) + 'em';
    }
  }

  /* ---------- rain, embers, motes, flash (column FX) ---------- */
  const fx = $('#fx'), ctx = fx.getContext('2d');
  let FW = 0, FH = 0, drops = [], embers = [], motes = [];
  function sizeFX() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    FW = window.innerWidth; FH = window.innerHeight;
    fx.width = FW * dpr; fx.height = FH * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drops = Array.from({ length: 200 }, () => ({ x: Math.random(), y: Math.random() * FH, l: 10 + Math.random() * 26, v: 9 + Math.random() * 11, a: 0.1 + Math.random() * 0.3 }));
    embers = []; motes = [];
  }
  const zone = (mid, a, b, vh) => smooth(range(mid, a - vh * 0.2, a + vh * 0.3)) * (1 - smooth(range(mid, b - vh * 0.3, b + vh * 0.2)));
  function inQuad(q) {
    const tri = Math.random() < 0.5 ? [q[0], q[1], q[2]] : [q[0], q[2], q[3]];
    let a = Math.random(), b = Math.random(); if (a + b > 1) { a = 1 - a; b = 1 - b; }
    return [tri[0][0] + a * (tri[1][0] - tri[0][0]) + b * (tri[2][0] - tri[0][0]), tri[0][1] + a * (tri[1][1] - tri[0][1]) + b * (tri[2][1] - tri[0][1])];
  }
  function drawFX(y, vh, t, dt, fl) {
    ctx.clearRect(0, 0, FW, FH);
    const x0 = OFF.stripRect[0], cw = OFF.stripRect[1];
    const mid = y + vh * 0.5, k = dt / 16;
    const rainA = Math.max(zone(mid, OFF.storm, OFF.p2 - vh * 0.1, vh), zone(mid, byId.s17.top, byId.s26.top + byId.s26.h, vh) * 0.85);
    if (rainA > 0.01) {
      ctx.lineWidth = 1.1;
      for (const d of drops) {
        if (!RM) { d.y += d.v * k; if (d.y > FH + 30) { d.y = -30; d.x = Math.random(); } }
        const px = x0 + d.x * cw;
        ctx.strokeStyle = 'rgba(175,195,235,' + (d.a * rainA * (1 + fl * 1.5)).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(px, d.y); ctx.lineTo(px - d.l * 0.16, d.y + d.l); ctx.stroke();
      }
      if (fl > 0.02) { ctx.fillStyle = 'rgba(150,180,255,' + (fl * 0.16 * rainA).toFixed(3) + ')'; ctx.fillRect(x0, 0, cw, FH); }
    }
    if (!RM) {
      for (const P of panels) {
        const rt = P.isStage ? 0 : P.top - y;
        if (rt > vh || rt + P.h < 0) continue;
        if (P.torches.length && P.id !== 'castle') for (const T of P.torches) {
          if (T.floor || T.el.classList.contains('soft') || Math.random() > 0.05 * k * (1 - P.dark)) continue;
          const sx = P.m[0] + T.x * P.m[2], sy = P.m[1] + T.y * P.m[3];
          if (sy < -20 || sy > vh + 20) continue;
          embers.push({ x: sx + (Math.random() - 0.5) * 12, y: sy, vx: (Math.random() - 0.5) * 0.6, vy: -(0.5 + Math.random() * 1.3), r: 0.6 + Math.random() * 1.4, life: 0, max: 60 + Math.random() * 90, ph: Math.random() * 6 });
        }
        if (P.cfg.motes && motes.filter(m => m.P === P).length < 70 && Math.random() < 0.5 * k) {
          const q = inQuad(P.cfg.motes);
          motes.push({ P, u: q[0], v: q[1], du: (Math.random() - 0.3) * 0.00012, dv: (Math.random() - 0.2) * 0.00009, r: 0.5 + Math.random() * 1.3, life: 0, max: 200 + Math.random() * 260, ph: Math.random() * 6 });
        }
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.x += (e.vx + Math.sin(t * 0.003 + e.ph) * 0.3) * k; e.y += e.vy * k; e.life += k;
      if (e.life > e.max) { embers.splice(i, 1); continue; }
      const a = Math.sin(Math.PI * e.life / e.max);
      ctx.fillStyle = 'rgba(255,120,40,' + (a * 0.25).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 3.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,214,150,' + (a * 0.95).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.283); ctx.fill();
    }
    if (embers.length > 400) embers.splice(0, embers.length - 400);
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.u += m.du * k + Math.sin(t * 0.0009 + m.ph) * 0.00004; m.v += m.dv * k; m.life += k;
      if (m.life > m.max) { motes.splice(i, 1); continue; }
      const sx = m.P.m[0] + m.u * m.P.m[2], sy = m.P.m[1] + m.v * m.P.m[3];
      if (sy < -10 || sy > vh + 10) continue;
      const a = Math.sin(Math.PI * m.life / m.max) * (0.5 + 0.5 * Math.sin(t * 0.004 + m.ph));
      ctx.fillStyle = 'rgba(210,228,255,' + (a * 0.2).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(sx, sy, m.r * 3, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(240,248,255,' + (a * 0.85).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(sx, sy, m.r, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- layout + loop ---------- */
  const OFF = {};
  function measure() {
    const pageTop = el => el.getBoundingClientRect().top + window.scrollY;
    OFF.title = pageTop(title); OFF.titleH = title.offsetHeight;
    OFF.storm = pageTop(storm); OFF.stormH = storm.offsetHeight;
    OFF.castleH = $('#castle').offsetHeight;
    OFF.echo = pageTop(echo); OFF.echoH = echo.offsetHeight;
    for (const P of panels) {
      P.top = pageTop(P.sec); P.h = P.sec.offsetHeight;
      P.W = P.inner.clientWidth; P.H = P.isStage ? P.inner.clientHeight : P.h;
      const v1 = coverView(P.W, P.H, PA, 1, 0.5, 0.5);
      P.Wb = P.W / v1[0]; P.Hb = P.H / v1[1];
      for (const a of P.atts) { a.style.width = P.Wb + 'px'; a.style.height = P.Hb + 'px'; }
    }
    OFF.p2 = byId.p2.top;
    const r = $('.strip').getBoundingClientRect(); OFF.stripRect = [r.left, r.width];
    SND.setZones(Array.from($('.strip').children).filter(e => e.id).map(e => [pageTop(e), pageTop(e) + e.offsetHeight, e.id]).sort((a, b) => a[0] - b[0]));
  }
  let lastW = 0;
  function layout(force) {
    const w = window.innerWidth;
    measure();
    if (force || w !== lastW) {
      lastW = w;
      if (heroGL) heroGL.resize();
      for (const E of POOL) if (E.owner) E.R.resize();
      buildStorm(); sizeTitleFX(); sizeBubbles();
    }
    sizeFX();
  }
  layout(true);
  let rT;
  window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => layout(false), 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); buildStorm(); sizeBubbles(); });
  window.addEventListener('load', () => measure());

  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(64, now - lastT); lastT = now;
    const y = window.scrollY, vh = window.innerHeight;
    const inStorm = (y + vh > OFF.storm && y < OFF.p2) || (y + vh > byId.s18.top && y < byId.s23.top + byId.s23.h);
    if (inStorm && !RM && now > nextFlash) { if (nextFlash) flash(0.5 + Math.random() * 0.5); nextFlash = now + 4500 + Math.random() * 5000; }
    const fl = flashAt(now);
    updateTitle(y, vh, now, dt);
    updateStorm(y, vh, now, fl);
    assignPool(y, vh);
    const amb = updatePanels(y, vh, now, fl);
    updateEcho(y, vh, now);
    drawFX(y, vh, now, dt, fl);
    SND.tick(y, vh);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
